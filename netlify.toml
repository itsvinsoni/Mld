# Netlify configuration for the MLD Memorial Sansthan public website + CRM app.
# SPA (single-page app) served from a clean-URL router — requires a rewrite so
# client-side routes (/institutions, /about, /admin, ...) all serve index.html.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# NOTE: The previous `[[plugins]] @netlify/plugin-cache-npm` block was the cause
# of the deploy failure. That package does NOT exist on the npm registry, so
# Netlify could not resolve it. node_modules caching is an OPTIONAL performance
# tweak (enable it in the Netlify site UI > Build & deploy > Caching) and is not
# required for the build. Removing it lets `npm run build` run normally.
